name: Build and deploy browser version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.11'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build WebAssembly site
        run: make wasm
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
